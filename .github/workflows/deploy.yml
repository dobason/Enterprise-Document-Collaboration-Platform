name: EDMS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  id-token: write # bắt buộc cho OIDC - KHÔNG dùng static AWS access key
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "17"
          cache: "maven"

      - name: Run unit tests cho toàn bộ 9 Lambda module (mvn test)
        run: |
          for dir in backend/java/functions/*/; do
            echo "== Testing $dir =="
            (cd "$dir" && mvn -B test)
          done

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "17"
          cache: "maven"

      - uses: aws-actions/setup-sam@v2

      - name: SAM build
        working-directory: backend
        run: sam build

      - name: SAM deploy
        working-directory: backend
        run: |
          sam deploy \
            --stack-name edms-dev \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides Stage=dev

      - name: Run integration tests
        env:
          API_URL: ${{ secrets.EDMS_API_URL }}
          USER_POOL_CLIENT_ID: ${{ secrets.EDMS_USER_POOL_CLIENT_ID }}
          TEST_EMAIL: ${{ secrets.EDMS_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.EDMS_TEST_PASSWORD }}
          TABLE_NAME: ${{ secrets.EDMS_TABLE_NAME }}
        run: bash backend/tests/integration/test_e2e_upload.sh

# GHI CHÚ CHO P4:
# 1. Chỉ CẦN duy nhất 1 secret nhạy cảm: AWS_DEPLOY_ROLE_ARN (ARN của IAM Role cho GitHub OIDC).
#    KHÔNG lưu AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY trong Secrets.
# 2. Cách tạo Role OIDC: xem mục 7.3 trong EDMS-Serverless-Roadmap.md.
# 3. Các secret còn lại (EDMS_API_URL...) chỉ để chạy integration test, không phải credential.
# 4. Runner ubuntu-latest có sẵn `jq` cài mặc định, không cần thêm bước cài đặt.
# 5. Stack đã 100% Java - không còn bước Python/pytest nào trong pipeline này.
