name: EDMS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "17"
          cache: "maven"

      - name: Build & Test Backend
        working-directory: backend
        run: mvn -B test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "17"
          cache: "maven"

      - name: Package backend jar
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - uses: aws-actions/setup-sam@v2

      # Upload jar lên S3 với key có version (GITHUB_SHA) để force CloudFormation
      # nhận ra code thay đổi mỗi lần deploy.
      - name: Upload jar to deploy bucket
        env:
          DEPLOY_BUCKET: edms-sam-deploy-319602346700
        working-directory: backend
        run: |
          aws s3 cp target/backend-java-1.0.0-SNAPSHOT.jar \
            s3://${DEPLOY_BUCKET}/backend-java-1.0.0-SNAPSHOT-${GITHUB_SHA}.jar

      # Thay CodeUri trong template bằng S3 URL (jar đã upload), rồi deploy trực tiếp.
      - name: Deploy via SAM
        working-directory: backend
        env:
          DEPLOY_BUCKET: edms-sam-deploy-319602346700
        run: |
          sed -i "s|CodeUri: target/backend-java-1.0.0-SNAPSHOT.jar|CodeUri: s3://${DEPLOY_BUCKET}/backend-java-1.0.0-SNAPSHOT-${GITHUB_SHA}.jar|" template.yaml
          sam deploy \
            --stack-name edms-lambda-stack \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides \
              "CognitoUserPoolId=${{ secrets.COGNITO_USER_POOL_ID }} \
               CognitoClientId=${{ secrets.COGNITO_CLIENT_ID }} \
               AuroraEndpoint=${{ secrets.AURORA_ENDPOINT }} \
               AwsRegion=ap-southeast-1 \
               S3BucketName=${{ secrets.AWS_S3_BUCKET }} \
               DbUserName=${{ secrets.DB_USER_AWS }} \
               DbUserPass=${{ secrets.DB_PASS_AWS }}"
