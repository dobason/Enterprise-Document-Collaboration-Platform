AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  EDMS Backend API - Spring Boot over AWS Lambda (Monolithic Lambda)

Parameters:
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID (vd ap-southeast-1_xxxx)
  CognitoClientId:
    Type: String
    Description: Cognito App Client ID
  AuroraEndpoint:
    Type: String
    Description: Aurora MySQL cluster endpoint (không kèm port)
  AwsRegion:
    Type: String
    Default: ap-southeast-1
  S3BucketName:
    Type: String
    Description: S3 bucket chứa tài liệu
  DbUserName:
    Type: String
    Default: admin
  DbUserPass:
    Type: String
    NoEcho: true
    Description: Mật khẩu Aurora (lưu an toàn - không commit)
  SnsTopicArn:
    Type: String
    Default: ""
    Description: SNS topic ARN cho email notification

Globals:
  Function:
    Timeout: 30
    MemorySize: 2048 # Khuyến nghị cho Java Spring Boot để giảm Cold Start

Resources:
  DocumentApprovalStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Definition: !Sub
        - |-
          {
            "Comment": "EDMS Document Approval Workflow",
            "StartAt": "CaptureToken",
            "States": {
              "CaptureToken": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke.waitForTaskToken",
                "Parameters": {
                  "FunctionName": "${EdmsApiFunction}",
                  "Payload": {
                    "edmsInternal": "captureToken",
                    "documentId.$": "$.documentId",
                    "taskToken.$": "$$.Task.Token"
                  }
                },
                "Next": "Decision"
              },
              "Decision": {
                "Type": "Choice",
                "Choices": [
                  { "Variable": "$.decision", "StringEquals": "APPROVED", "Next": "MarkApproved" },
                  { "Variable": "$.decision", "StringEquals": "REJECTED", "Next": "MarkRejected" }
                ],
                "Default": "MarkRejected"
              },
              "MarkApproved": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${EdmsApiFunction}",
                  "Payload": {
                    "edmsInternal": "markStatus",
                    "documentId.$": "$.documentId",
                    "decision.$": "$.decision",
                    "actedBy.$": "$.actedBy",
                    "reason.$": "$.reason"
                  }
                },
                "Next": "NotifyApproved"
              },
              "MarkRejected": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${EdmsApiFunction}",
                  "Payload": {
                    "edmsInternal": "markStatus",
                    "documentId.$": "$.documentId",
                    "decision.$": "$.decision",
                    "actedBy.$": "$.actedBy",
                    "reason.$": "$.reason"
                  }
                },
                "Next": "NotifyRejected"
              },
              "NotifyApproved": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sns:publish",
                "Parameters": {
                  "TopicArn": "${SnsTopicArn}",
                  "Subject": "EDMS - Document Approved",
                  "Message": "Your document \"${DocumentTitle}\" has been APPROVED."
                },
                "End": true
              },
              "NotifyRejected": {
                "Type": "Task",
                "Resource": "arn:aws:states:::sns:publish",
                "Parameters": {
                  "TopicArn": "${SnsTopicArn}",
                  "Subject": "EDMS - Document Rejected",
                  "Message": "Your document \"${DocumentTitle}\" has been REJECTED."
                },
                "End": true
              }
            }
          }
        - EdmsApiFunction: !GetAtt EdmsApiFunction.Arn
          SnsTopicArn: !Ref SnsTopicArn
          DocumentTitle: "document"
      Policies:
        - Statement:
            - Sid: InvokeBackendLambda
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt EdmsApiFunction.Arn
            - Sid: PublishToSns
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref SnsTopicArn

  EdmsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: target/backend-java-1.0.0-SNAPSHOT.jar
      Handler: com.edms.StreamLambdaHandler::handleRequest
      Runtime: java17
      Architectures:
        - x86_64
      Environment:
        Variables:
          SPRING_PROFILES_ACTIVE: aws
          # Lưu ý: KHÔNG đặt AWS_REGION - đây là reserved key, Lambda tự set
          COGNITO_REGION: !Ref AwsRegion
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          AURORA_ENDPOINT: !Ref AuroraEndpoint
          DB_USER_AWS: !Ref DbUserName
          DB_PASS_AWS: !Ref DbUserPass
          DB_NAME: edms
          AWS_S3_BUCKET: !Ref S3BucketName
          SNS_TOPIC_ARN: !Ref SnsTopicArn
          STEP_FUNCTIONS_ARN: !Ref DocumentApprovalStateMachine
          # Credentials AWS: dùng IAM Role của Lambda (không hardcode key).
          # Chỉ cần IAM Role có quyền s3 + cognito-idp (xem AWS-COGNITO-REQUIREMENTS.md)
      Policies:
        - Statement:
            - Sid: S3Access
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
                - s3:ListBucket
              Resource: "*"
            - Sid: CognitoAccess
              Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:RespondToAuthChallenge
                - cognito-idp:GetUser
              Resource: "*"
            - Sid: SnsAccess
              Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
            - Sid: StepFunctionsAccess
              Effect: Allow
              Action:
                - states:StartExecution
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: !Ref DocumentApprovalStateMachine
      Events:
        ProxyApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ProxyApiGreedy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  EdmsApiUrl:
    Description: "API Gateway endpoint URL for Prod environment"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
