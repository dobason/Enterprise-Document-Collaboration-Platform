spring:
   datasource:
     url: jdbc:mysql://localhost:3307/edms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
     driver-class-name: com.mysql.cj.jdbc.Driver
     username: root
     password: ${DB_PASS:12345}
   jpa:
     database-platform: org.hibernate.dialect.MySQLDialect
     hibernate:
       ddl-auto: none
     show-sql: true
     properties:
       hibernate:
         format_sql: true
   flyway:
     enabled: true
     baseline-on-migrate: true
     locations: classpath:db/migration

aws:
  region: ${AWS_REGION:ap-southeast-1}
  s3:
    bucket: ${AWS_S3_BUCKET:edms-docs-bucket-319602346700-ap-southeast-1-an}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
  cognito:
    region: ${COGNITO_REGION:${AWS_REGION:ap-southeast-1}}
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    client-id: ${COGNITO_CLIENT_ID:}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

jwt:
  secret: edmsEnterpriseSecretKeyForJwtAuthenticationTokenSigningMustBeVeryLong32BytesOrMore!
  expiration-ms: 86400000

storage:
  #local-dir: ./uploads
  type: s3

logging:
  level:
    com.edms: DEBUG
    org.flywaydb: INFO
