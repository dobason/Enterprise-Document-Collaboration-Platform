spring:
  datasource:
    url: jdbc:mysql://localhost:3306/edms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: quan0931848972   # ⚠️ Đổi thành mật khẩu MySQL của bạn
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: edmsEnterpriseSecretKeyForJwtAuthenticationTokenSigningMustBeVeryLong32BytesOrMore!
  expiration-ms: 86400000

storage:
  local-dir: ./uploads

logging:
  level:
    com.edms: DEBUG
    org.flywaydb: INFO
