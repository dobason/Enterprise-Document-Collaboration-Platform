spring:
  datasource:
    url: jdbc:mysql://${AURORA_ENDPOINT}:${AURORA_PORT:3306}/${DB_NAME:edms}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

aws:
  region: ap-southeast-1
  s3:
    bucket: edms-docs-bucket
  cognito:
    user-pool-id: ap-southeast-1_xxxxxx
    client-id: xxxxxxxxxxxxxxxxxx
