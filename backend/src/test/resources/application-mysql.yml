spring:
  datasource:
    url: jdbc:h2:mem:edmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

aws:
  region: ap-southeast-1
  s3:
    bucket: test-bucket
    access-key:
    secret-key:
  cognito:
    region: ap-southeast-1
    user-pool-id:
    client-id:
    access-key:
    secret-key:

jwt:
  secret: edmsEnterpriseSecretKeyForJwtAuthenticationTokenSigningMustBeVeryLong32BytesOrMore!
  expiration-ms: 86400000
